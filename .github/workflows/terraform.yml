name: "Enterprise GitOps Pipeline"

on:
  push:
    branches:
      - main

# Permissions required for Zero Trust OIDC authentication
permissions:
  id-token: write
  contents: read  

jobs:
  deploy-infrastructure:
    name: "Terraform Deploy"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # No Hardcoded Access Keys
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::459803359081:role/github-actions-terraform-role
          aws-region: us-east-1

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3

      # Automated Terraform Workflow
      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve